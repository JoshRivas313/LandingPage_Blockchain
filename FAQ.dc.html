<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FFFFFF; color: #17164F; font-family: 'Inter', sans-serif; }
  a { color: #2465F5; text-decoration: none; }
  a:hover { color: #2465F5; }
  input:focus, a:focus, button:focus { outline: 2px solid #2465F5; outline-offset: 2px; }
  .faq-item[open] summary .faq-chevron { transform: rotate(180deg); }
</style>
</helmet>

<div style="min-height:100vh; background:#FFFFFF; color:#17164F; font-family:'Inter',sans-serif;">
  <nav style="position:sticky; top:0; z-index:50; background:rgba(253,254,255,0.9); backdrop-filter:blur(12px); border-bottom:1px solid #e2e8f0;">
    <div style="max-width:900px; margin:0 auto; padding:0 clamp(16px,4vw,32px); display:flex; justify-content:space-between; align-items:center; height:72px; gap:12px;">
      <a href="Blockchain Conf.dc.html" style="display:flex; align-items:center; gap:10px; color:#17164F;">
        <img src="assets/blockchain-conf-logo.png" alt="Blockchain Conf" style="height:30px; width:auto; object-fit:contain;">
      </a>
      <a href="Blockchain Conf.dc.html" style="font-size:14px; font-weight:600; color:#64748b;">← Volver al inicio</a>
    </div>
  </nav>

  <main style="max-width:760px; margin:0 auto; padding:clamp(48px,8vw,80px) clamp(16px,4vw,32px) 96px;">
    <div style="text-align:center; margin-bottom:36px;">
      <div style="display:inline-flex; padding:6px 16px; border-radius:999px; border:1px solid rgba(36,101,245,0.2); background:#EEF2FF; color:#2465F5; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:16px;">Ayuda</div>
      <h1 style="font-family:'Manrope',sans-serif; font-weight:800; font-size:clamp(30px,4.2vw,44px); margin:0 0 12px 0; line-height:1.1;">Preguntas Frecuentes</h1>
      <p style="font-size:16px; color:#64748b; max-width:520px; margin:0 auto; line-height:1.6;">Resuelve tus dudas sobre la comunidad, el evento, la inscripción y las actividades de Blockchain Conf.</p>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="7">
        <details class="faq-item" style="background:#EEF2FF; border-radius:14px; padding:0; overflow:hidden; border:1px solid transparent; transition:border-color 0.2s ease;">
          <summary style="list-style:none; cursor:pointer; padding:20px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; font-weight:700; font-size:15px; color:#17164F;">
            <span>{{ item.q }}</span>
            <span class="faq-chevron" style="flex-shrink:0; transition:transform 0.2s ease; color:#2465F5; font-size:14px;">▾</span>
          </summary>
          <p style="margin:0; padding:0 22px 20px 22px; font-size:14px; color:#64748b; line-height:1.65;">{{ item.a }}</p>
        </details>
      </sc-for>
    </div>
  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const FAQ_ITEMS = [
  { q: "¿Necesito llevar mi entrada impresa?", a: "No es necesario llevar la entrada impresa, te recomendamos bajar el app de Luma y podrás mostrar tu entrada mediante el QR de la app." },
  { q: "¿Necesito llevar mi DNI para acceder al evento?", a: "Sí, es necesario presentar tu DNI para verificar tu identidad al momento del ingreso." },
  { q: "¿Puedo salir y volver a entrar al evento?", a: "Sí, los asistentes pueden salir y volver a entrar al evento en cualquier momento." },
  { q: "¿Hasta qué hora se extenderá el evento?", a: "El evento se extenderá hasta las 6:00 PM. Te recomendamos revisar la agenda para no perderte ninguna actividad." },
  { q: "¿Es necesario llevar una laptop al evento?", a: "No es obligatorio, pero si deseas traer laptop o algún otro dispositivo por favor no te olvides de llevar su adaptador ya que no brindaremos adaptadores." },
  { q: "¿Cuál es el horario máximo de ingreso al evento?", a: "Los asistentes pueden ingresar en cualquier momento durante el evento si llegan más tarde de las 9:00 a.m., sin embargo se recomienda estar temprano para que puedas aprovechar al máximo las sesiones." },
  { q: "¿Habrá estacionamiento disponible en el lugar del evento?", a: "No, no habrá estacionamiento disponible en esta ocasión. Le recomendamos tomar las precauciones del caso." },
]

class Component extends DCLogic {
  renderVals() {
    return {
      items: FAQ_ITEMS,
    }
  }
}
</script>
</body>
</html>
